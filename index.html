<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Git Mapper</title>
    <script>
      // Apply the stored theme before first paint so the window never flashes the wrong colour.
      try {
        var storedTheme = localStorage.getItem("git-mapper:theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9e6f2;
      }

      html.dark,
      html.dark body {
        background: #070b12;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
