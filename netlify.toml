# Git Mapper website on Netlify (public subdomain: gitmapper.fajarwz.com).
# Explicit paths — no [build.base], some deploy paths ignore it.
[build]
  command = "npm run build --prefix website"
  publish = "website/dist"

# No [[redirects]] here: the Astro build ships 404.html and the host serves it
# for not-found paths natively.

