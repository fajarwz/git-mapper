name: Release

# Builds the desktop bundles for all three platforms on a vX.Y.Z tag and opens a
# draft GitHub release with the updater feed (latest.json) attached. Publish it
# manually after checking the draft — the updater reads
# releases/latest/download/latest.json, so a broken feed is visible the moment it ships.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel, cross-compiled from an Apple Silicon runner
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Git Mapper v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bundler names every asset productName_<version>_<arch>..., so
      # releases/latest/download/<name> 404s the day the next version exists.
      # Re-upload the human-downloadable installers without the version so the
      # README links stay stable. Updater artifacts (.app.tar.gz, .sig,
      # latest.json) keep their versioned names: latest.json embeds those exact
      # paths, and a renamed copy would desync the updater feed.
      - name: Upload versionless download links
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${VERSION#v}"
          mkdir aliases
          find src-tauri/target -type f \( -name "*-setup.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) ! -name "*.sig" | while read -r file; do
            base="$(basename "$file")"
            stable="$(echo "$base" | sed "s/_$version//")"
            cp "$file" "aliases/$stable"
            echo "$base -> $stable"
          done
          gh release upload "$VERSION" aliases/* --clobber --repo "$GH_REPO"
